global:
  scrape_interval: 15s

scrape_configs:
  - job_name: studymate-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:18080']

  - job_name: studymate-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:19000']

  - job_name: studymate-mcp
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:18090']
